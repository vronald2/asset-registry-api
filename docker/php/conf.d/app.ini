; Application-specific PHP settings (loaded after the image defaults).

memory_limit = 256M
upload_max_filesize = 10M
post_max_size = 10M
expose_php = Off
date.timezone = UTC

; Development friendly OPcache: code changes on the bind mount are picked up immediately.
opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
