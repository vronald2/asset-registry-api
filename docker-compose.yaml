name: asset-registry

services:
    app:
        build:
            context: ./docker/php
        # Runs as the host user, so files created in the bind mount (vendor/, storage/, .env) stay writable for the
        # host. The Makefile exports HOST_UID/HOST_GID; plain "docker compose" falls back to 1000:1000.
        user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
        working_dir: /var/www/html
        volumes:
            - ./:/var/www/html
        depends_on:
            db:
                condition: service_healthy
        healthcheck:
            # The entrypoint creates the flag after "composer install" and the migrations have finished.
            test: ["CMD", "test", "-f", "/tmp/app-ready"]
            interval: 5s
            timeout: 3s
            retries: 120
            start_period: 10s

    web:
        image: nginx:1.29-alpine
        ports:
            - "${APP_PORT:-8080}:80"
        volumes:
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
            - ./public:/var/www/html/public:ro
        depends_on:
            app:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/up"]
            interval: 5s
            timeout: 3s
            retries: 12

    db:
        image: mysql:8.4
        environment:
            MYSQL_DATABASE: "${DB_DATABASE:-asset_registry}"
            MYSQL_USER: "${DB_USERNAME:-asset_registry}"
            MYSQL_PASSWORD: "${DB_PASSWORD:-secret}"
            MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-root}"
        ports:
            # Only on the host's loopback interface: the development credentials are well known.
            - "127.0.0.1:${DB_FORWARD_PORT:-33060}:3306"
        volumes:
            - db-data:/var/lib/mysql
            - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
        healthcheck:
            # TCP ping: during the first-start initialisation MySQL only listens on its socket.
            test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
            interval: 5s
            timeout: 5s
            retries: 30
            start_period: 30s

volumes:
    db-data:
