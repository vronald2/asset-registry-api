name: asset-registry

services:
    app:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
            args:
                # Match the host user on Linux: APP_UID=$(id -u) APP_GID=$(id -g) docker compose build
                UID: ${APP_UID:-1000}
                GID: ${APP_GID:-1000}
        image: asset-registry-app
        volumes:
            - ./:/var/www/html
        depends_on:
            mysql:
                condition: service_healthy
        restart: unless-stopped

    web:
        image: nginx:1.29-alpine
        ports:
            - "${APP_PORT:-8080}:80"
        volumes:
            - ./public:/var/www/html/public:ro
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - app
        restart: unless-stopped

    mysql:
        image: mysql:8.4
        environment:
            MYSQL_DATABASE: ${DB_DATABASE:-asset_registry}
            MYSQL_USER: ${DB_USERNAME:-asset_registry}
            MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
            MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
            MYSQL_TESTING_DATABASE: ${DB_TESTING_DATABASE:-asset_registry_testing}
        ports:
            - "${FORWARD_DB_PORT:-3307}:3306"
        volumes:
            - mysql-data:/var/lib/mysql
            - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
        healthcheck:
            test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
            interval: 5s
            timeout: 5s
            retries: 30
            start_period: 30s
        restart: unless-stopped

volumes:
    mysql-data:
