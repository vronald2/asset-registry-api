name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Quality gates (PHP 8.5, MySQL 8.4)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: asset_registry_testing
          MYSQL_USER: asset_registry
          MYSQL_PASSWORD: secret
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USERNAME: asset_registry
      DB_PASSWORD: secret

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: intl, pdo_mysql, zip
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare the environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: PSR-4 autoloading
        run: composer dump-autoload --strict-psr

      - name: Coding style (PSR-12)
        run: composer lint

      - name: Static analysis (Larastan)
        run: composer analyse

      - name: Tests
        run: composer test
